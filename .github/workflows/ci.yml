name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloud Run after tests"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -r requirements-dev.txt
      - run: pytest -q

  # Live check that every configured model still exists (catches INCIDENTS.md #1).
  # Runs only when the GROQ_API_KEY secret is set.
  model-smoke:
    runs-on: ubuntu-latest
    needs: test
    env: { GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: env.GROQ_API_KEY != ''
        run: pip install groq python-dotenv pydantic && python scripts/check_models.py

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [test, model-smoke]
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: speech-agent
          region: europe-west3
          source: .
          flags: --allow-unauthenticated --memory 2Gi --max-instances 2
          secrets: GROQ_API_KEY=groq-api-key:latest,AZURE_SPEECH_KEY=azure-speech-key:latest
          env_vars: AZURE_SPEECH_REGION=${{ vars.AZURE_SPEECH_REGION }}
